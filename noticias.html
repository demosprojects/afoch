<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias | AFOCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <meta name="theme-color" content="#001A3D">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-afochClaro text-slate-800 min-h-screen flex flex-col" data-pagina="noticias">
    <div id="site-header"></div>
    <div id="page-banner" data-titulo="Noticias" data-bajada="Novedades y notas de prensa de la Asociación."></div>

    <main class="container mx-auto px-6 py-6 md:py-10 flex-1">
        <div id="contenido"></div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="layout.js"></script>
    <script type="module">
        import { listarNoticias, obtenerNoticia } from './firebase.js';
        import { optimizar } from './cloudinary.js';
        import { cargando, pelota, sinDatos, errorCarga } from './ui.js';
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const TZ = 'America/Argentina/Buenos_Aires';
        const vacio = m => `<p class="text-slate-500 text-sm">${m}</p>`;
        const fmt = d => d.toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric', timeZone: TZ });
        const cont = $('contenido');
        const id = new URLSearchParams(location.search).get('id');

        const tarjeta = n => `
            <a href="noticias.html?id=${encodeURIComponent(n.id)}" class="group block bg-white border border-slate-200 overflow-hidden hover:shadow-md transition">
                <div class="h-48 overflow-hidden bg-slate-100">${n.imagenUrl ? `<img src="${esc(optimizar(n.imagenUrl, 800))}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="">` : '<div class="w-full h-full bg-afochAzul/10"></div>'}</div>
                <div class="p-5">
                    <div class="flex justify-between text-[11px] font-semibold tracking-wide uppercase mb-2"><span class="text-afochMedio">${esc(n.categoria)}</span><span class="text-slate-500 normal-case font-normal">${esc(fmt(n.fecha))}</span></div>
                    <h2 class="font-sports uppercase text-xl leading-snug text-afochAzul group-hover:text-afochMedio transition">${esc(n.titulo)}</h2>
                    ${n.resumen ? `<p class="text-sm text-slate-600 mt-2">${esc(n.resumen)}</p>` : ''}
                </div>
            </a>`;

        async function lista() {
            cont.innerHTML = `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${cargando('noticias', 6)}</div>`;
            try {
                const noticias = await listarNoticias(50);
                cont.insertAdjacentHTML('beforeend', '');
                cont.innerHTML = noticias.length
                    ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">${noticias.map(tarjeta).join('')}</div>`
                    : sinDatos('noticias');
            } catch (e) { console.error(e); cont.innerHTML = errorCarga('las noticias'); }
        }

        async function detalle(id) {
            cont.innerHTML = pelota('Cargando noticia…');
            try {
                const n = await obtenerNoticia(id);
                if (!n || n.publicada === false) {
                    history.replaceState(null, '', location.pathname);
                    await lista();
                    cont.insertAdjacentHTML('afterbegin', '<p class="text-sm text-amber-700 mb-4">La noticia que buscás no está disponible. Estas son las noticias vigentes.</p>');
                    return;
                }
                document.title = `${n.titulo} | AFOCH`;
                const parrafos = String(n.contenido || '').split(/\n\s*\n/).map(p => `<p class="mb-4">${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
                cont.innerHTML = `
                <article class="max-w-3xl bg-white border border-slate-200 p-5 md:p-10">
                    <a href="noticias.html" class="text-sm font-semibold text-afochMedio hover:underline">← Volver a noticias</a>
                    <div class="flex gap-4 text-[11px] font-semibold tracking-wide uppercase mt-6 mb-2"><span class="text-afochMedio">${esc(n.categoria)}</span><span class="text-slate-500 normal-case font-normal">${esc(fmt(n.fecha))}</span></div>
                    <h2 class="font-sports uppercase text-2xl sm:text-3xl text-afochAzul leading-tight mb-6">${esc(n.titulo)}</h2>
                    ${n.imagenUrl ? `<img src="${esc(optimizar(n.imagenUrl, 1200))}" class="w-full max-h-[240px] sm:max-h-[420px] object-cover mb-6" alt="">` : ''}
                    ${n.resumen ? `<p class="text-lg text-slate-700 font-semibold mb-4">${esc(n.resumen)}</p>` : ''}
                    <div class="text-slate-700 leading-relaxed">${parrafos}</div>
                </article>`;
            } catch (e) { console.error(e); cont.innerHTML = errorCarga('la noticia'); }
        }

        id ? detalle(id) : lista();
</script>
</body>
</html>
