<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos | AFOCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <meta name="theme-color" content="#001A3D">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-afochClaro text-slate-800 min-h-screen flex flex-col" data-pagina="torneos">
    <div id="site-header"></div>
    <div id="page-banner" data-titulo="Torneos y fixture" data-bajada="Programación de partidos de la Asociación."></div>

    <main class="container mx-auto px-6 py-6 md:py-10 flex-1">
        <div class="grid lg:grid-cols-[1fr_320px] gap-8">
            <div id="programacion"></div>
            <aside class="bg-white border border-slate-200 p-6 h-fit">
                <div class="flex items-baseline justify-between mb-4 pb-3 border-b-2 border-afochCeleste">
                    <h2 class="font-sports uppercase text-xl text-afochAzul">Posiciones</h2>
                    <a href="posiciones.html" class="text-sm font-semibold text-afochMedio hover:underline">Ver todas</a>
                </div>
                <div id="posiciones" aria-live="polite"></div>
            </aside>
        </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="layout.js"></script>
    <script type="module">
        import { listarPartidos, escucharProgramacion, escucharClubes, escucharPosiciones } from './firebase.js';
        import { optimizar } from './cloudinary.js';
        import { cargando, sinDatos, errorCarga } from './ui.js';
        import { parsearProgramacion, montarProgramacion, crearBuscadorEscudos } from './programacion.js';
        import { montarCarrusel } from './posiciones.js';
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const TZ = 'America/Argentina/Buenos_Aires';
        const cont = $('programacion'), lado = $('posiciones');
        const escudo = u => u ? `<img src="${esc(optimizar(u, 80))}" class="w-10 h-10 sm:w-8 sm:h-8 object-contain shrink-0" alt="">` : '';
        const fila = (p, etiqueta = '') => {
            const hora = p.fecha.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ });
            return `
            <div class="border border-slate-200 bg-white p-3 sm:p-4">
                <div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-2 sm:gap-3">
                    <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-2 min-w-0 text-center sm:text-left font-sports uppercase text-sm sm:text-lg text-afochAzul leading-tight">${escudo(p.localEscudo)}<span class="min-w-0 break-words">${esc(p.localNombre)}</span></div>
                    <div class="bg-afochAzul text-white font-sports px-2 sm:px-3 py-1 text-base sm:text-lg shrink-0">${etiqueta || hora}</div>
                    <div class="flex flex-col-reverse sm:flex-row items-center sm:justify-end gap-1 sm:gap-2 min-w-0 text-center sm:text-right font-sports uppercase text-sm sm:text-lg text-afochAzul leading-tight"><span class="min-w-0 break-words">${esc(p.visitanteNombre)}</span>${escudo(p.visitanteEscudo)}</div>
                </div>
                <div class="mt-3 text-xs text-slate-500">${esc([p.estadio, p.torneo].filter(Boolean).join(' · '))}</div>
            </div>`;
        };
        const diaLargo = d => d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: TZ });

        /* Estado compartido: todo se redibuja solo cuando cambia algo en el panel (sin recargar la página). */
        let programacion, tablas, clubes = null, buscador = () => '', manuales = null, secuencia = 0;
        const escudoDe = n => { const u = buscador(n); return u ? optimizar(u, 80) : ''; };

        // Respaldo: partidos cargados a mano (se leen una sola vez, solo si no hay programación en texto)
        async function htmlManuales() {
            manuales ??= await listarPartidos(200);
            const ahora = new Date();
            const proximos = manuales.filter(p => p.estado === 'programado' && p.fecha >= ahora).sort((a, b) => a.fecha - b.fecha);
            const suspendidos = manuales.filter(p => p.estado === 'suspendido').sort((a, b) => a.fecha - b.fecha);
            const porDia = new Map();
            proximos.forEach(p => { const k = diaLargo(p.fecha); porDia.set(k, [...(porDia.get(k) || []), p]); });
            let html = '';
            if (!proximos.length) html += sinDatos('partidos');
            porDia.forEach((partidos, dia) => {
                html += `<h2 class="font-sports uppercase text-lg text-afochMedio mt-8 first:mt-0 mb-3 capitalize">${esc(dia)}</h2><div class="space-y-3">${partidos.map(p => fila(p)).join('')}</div>`;
            });
            if (suspendidos.length) html += `<h2 class="font-sports uppercase text-lg text-amber-700 mt-10 mb-3">Partidos suspendidos</h2><div class="space-y-3">${suspendidos.map(p => fila(p, 'SUSP.')).join('')}</div>`;
            return html;
        }

        async function pintarProgramacion() {
            if (programacion === undefined || clubes === null) return;
            const mia = ++secuencia;
            const lista = programacion?.texto ? parsearProgramacion(programacion.texto) : [];
            if (lista.length) { montarProgramacion(cont, lista, { escudoDe }); return; }
            try { const html = await htmlManuales(); if (mia === secuencia) cont.innerHTML = html; }
            catch (e) { console.error(e); if (mia === secuencia) cont.innerHTML = errorCarga('la programación'); }
        }

        function pintarPosiciones() {
            if (tablas === undefined || clubes === null) return;
            if (!tablas.length) { montarCarrusel(lado, [], {}); lado.innerHTML = sinDatos('posiciones', true); return; }
            montarCarrusel(lado, tablas, { escudoDe });
        }

        cont.innerHTML = cargando('partidos', 4);
        lado.innerHTML = cargando('tabla', 1);

        escucharClubes(lista => { clubes = lista; buscador = crearBuscadorEscudos(lista); pintarProgramacion(); pintarPosiciones(); },
                       e => { console.warn('Sin escudos', e); if (clubes === null) clubes = []; pintarProgramacion(); pintarPosiciones(); });
        escucharProgramacion(cfg => { programacion = cfg; pintarProgramacion(); },
                             e => { console.error('No se pudo leer la programación', e); programacion = null; pintarProgramacion(); });
        escucharPosiciones(lista => { tablas = lista; pintarPosiciones(); },
                           e => { console.error('No se pudieron cargar las posiciones', e); lado.innerHTML = errorCarga('las posiciones', true); });
    </script>
</body>
</html>
