<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubes | AFOCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <meta name="theme-color" content="#001A3D">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-afochClaro text-slate-800 min-h-screen flex flex-col" data-pagina="clubes">
    <div id="site-header"></div>
    <div id="page-banner" data-titulo="Clubes afiliados" data-bajada="Instituciones que forman parte de la Asociación."></div>

    <main class="container mx-auto px-4 sm:px-6 py-6 md:py-10 flex-1">
        <div id="contenido"></div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="layout.js"></script>
    <script type="module">
        import { listarClubes } from './firebase.js';
        import { optimizar } from './cloudinary.js';
        import { cargando, sinDatos, errorCarga } from './ui.js';

        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const cont = $('contenido');
        let clubes = [];

        /* ---------- utilidades ---------- */
        const idUrl = () => new URLSearchParams(location.search).get('id');
        const enlaceClub = id => `${location.pathname}?id=${encodeURIComponent(id)}`;
        const seguro = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : ''; // evita javascript: y similares
        const listaDe = v => (Array.isArray(v) ? v : String(v || '').split(/[,\n]/)).map(s => String(s).trim()).filter(Boolean);
        const num = v => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n.toLocaleString('es-AR') : ''; };
        const inicialesPersona = n => String(n).trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
        const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || '').trim());
        const iniciales = c => (c.nombreCorto || c.nombre).substring(0, 3).toUpperCase();

        /** Actualiza la ruta "Inicio / Clubes / Nombre" del banner superior. */
        function migas(nombre) {
            const actual = document.querySelector('#page-banner [aria-current="page"]');
            if (!actual) return;
            actual.innerHTML = nombre
                ? `<a href="clubes.html" data-club="" class="font-normal text-white/70 hover:text-afochCeleste transition">Clubes</a> <span class="text-white/40" aria-hidden="true">/</span> ${esc(nombre)}`
                : 'Clubes afiliados';
        }

        /* ---------- lista ---------- */
        const tarjeta = c => `
            <a href="${esc(enlaceClub(c.id))}" data-club="${esc(c.id)}" class="group block bg-white border border-slate-200 p-4 sm:p-6 text-center hover:border-afochMedio hover:shadow-md transition focus:outline-none focus-visible:ring-2 focus-visible:ring-afochCeleste">
                <div class="w-20 h-20 sm:w-24 sm:h-24 mx-auto mb-4 flex items-center justify-center">
                    ${c.escudoUrl
                        ? `<img src="${esc(optimizar(c.escudoUrl, 200))}" class="max-w-full max-h-full object-contain" alt="Escudo de ${esc(c.nombre)}">`
                        : `<span class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-afochClaro border border-slate-200 flex items-center justify-center font-sports text-2xl text-slate-400">${esc(iniciales(c))}</span>`}
                </div>
                <h2 class="font-sports uppercase text-base sm:text-lg text-afochAzul leading-snug break-words group-hover:text-afochMedio transition">${esc(c.nombre)}</h2>
                ${c.nombreCorto && c.nombreCorto !== c.nombre ? `<p class="text-xs text-slate-500 mt-1">${esc(c.nombreCorto)}</p>` : ''}
                <span class="inline-block mt-3 text-xs font-semibold text-slate-500 group-hover:text-afochMedio transition">Ver club →</span>
            </a>`;

        function lista() {
            document.title = 'Clubes | AFOCH';
            migas('');
            cont.innerHTML = clubes.length
                ? `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">${clubes.map(tarjeta).join('')}</div>`
                : sinDatos('clubes');
        }

        /* ---------- ficha del club ---------- */
        const ICO = {
            compartir: '<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/>',
            pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'
        };
        const icono = (k, cls = 'w-4 h-4') => `<svg class="${cls} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
        const bloque = (titulo, cuerpo) => `
            <section class="bg-white border border-slate-200 p-5 sm:p-6">
                <h3 class="font-sports uppercase text-lg text-afochAzul mb-4 pb-2 border-b-2 border-afochCeleste">${titulo}</h3>
                ${cuerpo}
            </section>`;

        function detalle(c) {
            document.title = `${c.nombre} | AFOCH`;
            migas(c.nombre);

            const cats = listaDe(c.categorias);
            const historia = String(c.historia || '').trim();
            const direccion = String(c.direccion || '').trim();
            const mapa = seguro(c.mapaUrl) || (direccion
                ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([direccion, c.localidad].filter(Boolean).join(', '))}`
                : '');
            const ig = seguro(c.instagram), fb = seguro(c.facebook);
            const datos = [
                ['Apodo', c.apodo],
                ['Fundación', c.fundacion],
                ['Afiliado a AFOCH desde', c.afiliacion],
                ['Personería jurídica', c.personeria],
                ['Socios', num(c.socios)],
                ['Colores', c.colores],
                ['Rival clásico', c.rivalClasico],
                ['Localidad', c.localidad],
                ['Dirección', direccion],
                ['Cancha', c.estadio],
                ['Capacidad', num(c.capacidad) && `${num(c.capacidad)} personas`],
                ['Superficie', c.superficie]
            ].filter(([, v]) => v);

            const chips = [c.apodo ? `«${String(c.apodo).trim()}»` : '', c.fundacion ? `Fundado en ${c.fundacion}` : '', c.localidad].filter(Boolean)
                .map(t => `<span class="inline-flex items-center bg-white/10 border border-white/20 text-white text-xs font-semibold tracking-wide uppercase px-3 py-1">${esc(t)}</span>`).join('');

            const escudo = c.escudoUrl
                ? `<img src="${esc(optimizar(c.escudoUrl, 300))}" class="max-w-full max-h-full object-contain" alt="Escudo de ${esc(c.nombre)}">`
                : `<span class="font-sports text-3xl text-slate-400">${esc(iniciales(c))}</span>`;

            const parrafos = historia.split(/\n\s*\n/).map(p => `<p class="mb-3 last:mb-0">${esc(p).replace(/\n/g, '<br>')}</p>`).join('');

            const cHistoria = historia ? bloque('Historia', `<div class="text-[15px] sm:text-base text-slate-700 leading-relaxed break-words">${parrafos}</div>`) : '';
            const cCategorias = cats.length ? bloque('Categorías', `
                <div class="flex items-center gap-4 mb-4">
                    <span class="font-sports text-5xl text-afochMedio leading-none">${cats.length}</span>
                    <span class="text-sm text-slate-600">categoría${cats.length === 1 ? '' : 's'}</span>
                </div>
                <ul class="flex flex-wrap gap-2">${cats.map(x => `<li class="bg-afochClaro border border-slate-200 text-afochAzul text-sm font-semibold px-3 py-1">${esc(x)}</li>`).join('')}</ul>`) : '';

            const redes = [ig && ['Instagram', ig], fb && ['Facebook', fb]].filter(Boolean);
            const cDatos = (datos.length || mapa || redes.length) ? bloque('Datos del club', `
                ${datos.length ? `<dl class="space-y-3">${datos.map(([k, v]) => `<div><dt class="text-[11px] font-semibold tracking-wide uppercase text-slate-500">${k}</dt><dd class="text-slate-800 font-semibold break-words">${esc(v)}</dd></div>`).join('')}</dl>` : ''}
                ${mapa ? `<a href="${esc(mapa)}" target="_blank" rel="noopener noreferrer" class="${datos.length ? 'mt-5 ' : ''}flex items-center justify-center gap-2 bg-afochAzul text-white text-sm font-semibold px-4 py-3 hover:bg-afochMedio transition">${icono('pin')} Cómo llegar</a>` : ''}
                ${redes.length ? `<div class="mt-3 flex gap-3">${redes.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" class="flex-1 text-center border border-slate-300 text-slate-700 text-sm font-semibold px-3 py-2 hover:border-afochMedio hover:text-afochMedio transition">${n}</a>`).join('')}</div>` : ''}`) : '';

            const cargos = [['Presidente', c.presidente], ['Vicepresidente', c.vicepresidente], ['Secretario', c.secretario], ['Tesorero', c.tesorero]]
                .filter(([, v]) => String(v || '').trim());
            const cDirectiva = cargos.length ? bloque('Comisión directiva', `
                <ul class="grid sm:grid-cols-2 gap-3">${cargos.map(([k, v]) => `
                    <li class="flex items-center gap-3 border border-slate-200 bg-afochClaro p-3">
                        <span class="w-11 h-11 rounded-full bg-afochAzul text-white flex items-center justify-center font-sports text-sm shrink-0" aria-hidden="true">${esc(inicialesPersona(v))}</span>
                        <div class="min-w-0"><p class="text-[11px] font-semibold tracking-wide uppercase text-slate-500">${k}</p><p class="text-afochAzul font-semibold break-words">${esc(v)}</p></div>
                    </li>`).join('')}</ul>`) : '';

            const titulos = (Array.isArray(c.titulos) ? c.titulos : String(c.titulos || '').split('\n')).map(x => String(x).trim()).filter(Boolean);
            const cPalmares = titulos.length ? bloque('Palmarés', `
                <ul class="space-y-2">${titulos.map(t => `<li class="flex gap-3 text-slate-700"><span class="mt-2 w-2 h-2 bg-afochCeleste shrink-0" aria-hidden="true"></span><span class="break-words">${esc(t)}</span></li>`).join('')}</ul>`) : '';

            const tel = String(c.telefono || '').trim(), mail = String(c.email || '').trim(), web = seguro(c.web);
            const filas = [
                tel && ['Teléfono', `<a href="tel:${esc(tel.replace(/[^\d+]/g, ''))}" class="text-afochMedio hover:underline">${esc(tel)}</a>`],
                emailOk(mail) && ['Email', `<a href="mailto:${esc(mail)}" class="text-afochMedio hover:underline">${esc(mail)}</a>`],
                web && ['Sitio web', `<a href="${esc(web)}" target="_blank" rel="noopener noreferrer" class="text-afochMedio hover:underline">${esc(web.replace(/^https?:\/\//i, '').replace(/\/$/, ''))}</a>`]
            ].filter(Boolean);
            const cContacto = filas.length ? bloque('Contacto', `<dl class="space-y-3">${filas.map(([k, v]) => `<div><dt class="text-[11px] font-semibold tracking-wide uppercase text-slate-500">${k}</dt><dd class="font-semibold break-words">${v}</dd></div>`).join('')}</dl>`) : '';

            const hayInfo = cDirectiva || cHistoria || cCategorias || cPalmares || cDatos || cContacto;

            cont.innerHTML = `
            <div class="max-w-6xl mx-auto min-w-0">
                <a href="clubes.html" data-club="" class="inline-block mb-4 text-sm font-semibold text-afochMedio hover:underline">← Volver a clubes</a>

                <header class="relative overflow-hidden bg-gradient-to-br from-afochAzul via-[#022a5e] to-afochMedio text-white p-5 sm:p-8 md:p-10 mb-6">
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_90%_0%,rgba(0,209,255,.25),transparent_55%)]" aria-hidden="true"></div>
                    <div class="absolute left-0 top-0 h-1 w-full bg-gradient-to-r from-afochCeleste via-afochCeleste/40 to-transparent" aria-hidden="true"></div>
                    <div class="relative flex flex-col sm:flex-row items-center sm:items-center gap-5 sm:gap-8 text-center sm:text-left">
                        <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-white p-4 shrink-0 flex items-center justify-center shadow-xl shadow-black/30">${escudo}</div>
                        <div class="min-w-0 flex-1">
                            <h2 class="font-sports uppercase text-2xl sm:text-4xl leading-tight break-words">${esc(c.nombre)}</h2>
                            ${c.nombreCorto && c.nombreCorto !== c.nombre ? `<p class="text-white/70 text-sm mt-1">${esc(c.nombreCorto)}</p>` : ''}
                            ${chips ? `<div class="mt-4 flex flex-wrap justify-center sm:justify-start gap-2">${chips}</div>` : ''}
                        </div>
                        <button type="button" data-compartir="${esc(c.id)}" class="shrink-0 inline-flex items-center gap-2 border border-white/50 text-white text-sm font-semibold px-4 py-2.5 hover:bg-white hover:text-afochAzul transition">${icono('compartir')}<span>Compartir</span></button>
                    </div>
                </header>

                ${hayInfo ? `
                <div class="grid lg:grid-cols-[1fr_340px] gap-6 items-start">
                    <div class="space-y-6 min-w-0">${cDirectiva}${cHistoria}${cCategorias}${cPalmares}</div>
                    ${(cDatos || cContacto) ? `<aside class="min-w-0 space-y-6">${cDatos}${cContacto}</aside>` : ''}
                </div>` : `
                <div class="bg-white border border-dashed border-slate-300 text-center py-10 px-4">
                    <p class="font-sports uppercase text-lg text-afochAzul">Ficha en preparación</p>
                    <p class="text-sm text-slate-500 mt-2">Muy pronto vas a encontrar acá la información de este club.</p>
                </div>`}
            </div>`;
        }

        /* ---------- navegación (lista <-> ficha, sin recargar) ---------- */
        function mostrar(subir = false) {
            const id = idUrl();
            if (!id) lista();
            else {
                const c = clubes.find(x => x.id === id);
                if (c) detalle(c);
                else {
                    history.replaceState(null, '', location.pathname);
                    lista();
                    cont.insertAdjacentHTML('afterbegin', '<p class="text-sm text-amber-700 mb-4">El club que buscás no está disponible. Estos son los clubes afiliados.</p>');
                }
            }
            if (subir) window.scrollTo({ top: 0 });
        }

        document.addEventListener('click', e => {
            const a = e.target.closest('a[data-club]');
            if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // clic normal: sin recargar
            e.preventDefault();
            const id = a.dataset.club;
            history.pushState(null, '', id ? enlaceClub(id) : location.pathname);
            mostrar(true);
        });
        window.addEventListener('popstate', () => mostrar());

        /* ---------- compartir ---------- */
        cont.addEventListener('click', async e => {
            const b = e.target.closest('[data-compartir]');
            if (!b) return;
            const c = clubes.find(x => x.id === b.dataset.compartir);
            const url = `${location.origin}${enlaceClub(b.dataset.compartir)}`;
            const texto = b.querySelector('span');
            const aviso = t => { texto.textContent = t; setTimeout(() => { texto.textContent = 'Compartir'; }, 2000); };
            if (navigator.share) {
                try { await navigator.share({ title: `${c?.nombre || 'Club'} | AFOCH`, url }); } catch { /* cancelado */ }
                return;
            }
            try { await navigator.clipboard.writeText(url); aviso('¡Link copiado!'); }
            catch { prompt('Copiá este link:', url); }
        });

        /* ---------- carga inicial ---------- */
        cont.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">${cargando('clubes', 8)}</div>`;
        let cargaOk = true;
        try {
            clubes = (await listarClubes()).filter(c => c.activo !== false);
        } catch (e) {
            cargaOk = false;
            console.error(e);
            cont.innerHTML = errorCarga('los clubes');
        }
        if (cargaOk) mostrar();
</script>
</body>
</html>
